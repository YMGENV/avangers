<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#05080d"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARK OS</title>
<style>
:root{--g:#ffc247;--r:#e5321f;--c:#4fe3ff;--bg:#05060a;--tx:#ffe9bd;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none}
#lock{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) 0 calc(24px + env(safe-area-inset-bottom,0));transition:transform 1.2s cubic-bezier(.7,0,.3,1),opacity 1.2s;background:#05060a}

#bg{position:absolute;inset:0;width:100%;height:100%}
#clock{position:relative;width:min(70vw,48vh,420px);aspect-ratio:1;margin-top:8vh}
#clock svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px #ffa72f)}
#clock .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#time{font-size:clamp(34px,min(9vw,8vh),72px);font-weight:200;letter-spacing:.06em;color:var(--g);text-shadow:0 0 18px #ff9f1a}

.bot{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,170,50,.5)}100%{box-shadow:0 0 0 26px rgba(255,170,50,0)}}
.hint{font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.7}

.card{width:min(92vw,360px);padding:26px;border:1px solid var(--g);border-radius:18px;background:rgba(20,10,5,.7);text-align:center;box-shadow:0 0 40px rgba(255,150,30,.25)}

.shake{animation:sh .4s}

#reactor{position:fixed;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;opacity:0;transform:scale(.2)}

.arc{position:relative;width:min(60vw,50vh,380px);aspect-ratio:1}
.arc b{position:absolute;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 18px var(--c),inset 0 0 18px var(--c)}
.arc b:nth-child(1){inset:0;border-style:dashed;animation:spin 8s linear infinite}
.arc b:nth-child(2){inset:12%;border-width:6px;border-color:#2ab5d6 transparent #2ab5d6 transparent;animation:spin 3s linear infinite reverse}
.arc b:nth-child(3){inset:26%;border-style:dotted;animation:spin 5s linear infinite}
.arc b:nth-child(4){inset:38%;background:radial-gradient(#fff,var(--c) 45%,transparent 72%);border:0}
.arc span{position:absolute;inset:auto 0 -14%;text-align:center;letter-spacing:.5em;color:var(--c);font-size:14px;text-shadow:0 0 10px var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
#home{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0)) 16px calc(14px + env(safe-area-inset-bottom,0));background:radial-gradient(ellipse at 50% 30%,#2b0b08 0%,#0a0408 55%,#05060a 100%);opacity:0;transition:opacity 1s}
#home.on{opacity:1}
#home:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(79,227,255,.035) 3px 4px);pointer-events:none}
.top{width:100%;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:var(--c);text-transform:uppercase;z-index:2}
.top button{background:none;border:1px solid var(--c);color:var(--c);border-radius:6px;padding:4px 10px;cursor:pointer;letter-spacing:.15em}
#sleep{margin:auto;text-align:center;transition:opacity .6s,transform .6s}
#home.awake #sleep{opacity:0;transform:scale(.6);pointer-events:none;position:absolute}
#sleep .mini{width:110px;height:110px;margin:0 auto 22px;position:relative}
#sleep .mini b{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);animation:pulse2 2s infinite}
#sleep .mini b:nth-child(2){animation-delay:1s}
@keyframes pulse2{to{transform:scale(2);opacity:0}}
#sleep .mini i{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(#fff,var(--c));box-shadow:0 0 30px var(--c)}
#sleep h1{font-weight:200;font-size:clamp(20px,3.4vw,38px);letter-spacing:.3em;color:var(--g)}
#sleep p{margin:8px 0 18px;opacity:.7;font-size:13px;letter-spacing:.15em}
#sleep .btn{flex:none;padding:10px 26px}
#apps{display:none;width:100%;max-width:1100px;margin:auto;grid-template-columns:repeat(auto-fill,minmax(clamp(88px,15vw,170px),1fr));gap:clamp(12px,2.4vw,30px);z-index:2}

.app{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;opacity:0;transform:scale(.4) translateY(30px);animation:pop .6s forwards}
@keyframes pop{to{opacity:1;transform:none}}
.app .ic{width:clamp(64px,10vw,110px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(28px,4.6vw,50px);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:linear-gradient(145deg,var(--r),#7a130b 55%,#2a0805);box-shadow:inset 0 0 0 3px var(--g);transition:transform .2s,filter .2s}
.app:hover .ic{transform:scale(1.12);filter:drop-shadow(0 0 14px var(--g))}
.app small{font-size:clamp(10px,1.4vw,14px);letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
#win{position:fixed;inset:0;z-index:4;background:rgba(5,6,10,.94);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 14px 14px}
#win.on{display:flex}
#win header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--g);color:var(--g);letter-spacing:.25em;text-transform:uppercase}
#win header button{background:var(--r);border:0;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
#body{flex:1;overflow:auto;padding:16px 4px;max-width:900px;width:100%;margin:0 auto;user-select:text}

.in2{display:flex;gap:8px;margin-top:10px}.in2 input,textarea{flex:1;background:#0b0b10;border:1px solid var(--g);border-radius:8px;color:var(--tx);padding:11px;font-size:15px;outline:none}
.in2 .btn{flex:none;padding:0 18px}
textarea{width:100%;height:50vh;resize:none}
.list{display:grid;gap:10px}.list div{padding:12px;border:1px solid #7a5a1f;border-left:4px solid var(--r);border-radius:8px;background:rgba(229,50,31,.07)}.list b{color:var(--g)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto}.calc .scr{grid-column:1/-1;text-align:right;font-size:30px;color:var(--c);padding:10px;border:1px solid var(--c);border-radius:8px;min-height:56px;overflow:hidden}.calc button{padding:16px;border-radius:10px;border:1px solid var(--g);background:#1a0d08;color:var(--g);font-size:18px;cursor:pointer}
canvas.rd{display:block;margin:0 auto;max-width:100%;border-radius:50%;box-shadow:0 0 30px rgba(79,227,255,.35)}
.kp{grid-template-columns:repeat(3,1fr);max-width:300px;margin:8px auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}.cal b{color:var(--c);font-size:12px}.cal i{font-style:normal;padding:10px 0;border:1px solid #3a2a10;border-radius:8px}.cal i.td{background:var(--g);color:#1a0d00}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--g)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--r);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px}
.ct{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #3a2a10;cursor:pointer}
.brand{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:2;color:var(--g);letter-spacing:.5em;font-size:12px;text-shadow:0 0 10px #ff9f1a}
#home:after{content:"A";position:absolute;inset:0;display:grid;place-items:center;font-size:70vmin;font-weight:900;color:rgba(255,194,71,.045);pointer-events:none}
[data-theme=command]{--g:#e8faff;--r:#168bff;--c:#00d9ff;--tx:#e8faff}
[data-theme=shield]{--g:#9fb4c7;--r:#3a4a5c;--c:#00d9ff;--tx:#dbe6f0}
[data-theme=minimal]{--g:#e8faff;--r:#2a3340;--c:#8fa3b8;--tx:#e8faff}

[data-theme]:not([data-theme=iron]) .app .ic{background:linear-gradient(145deg,var(--r),#05080d)!important}
[data-theme]:not([data-theme=iron]) #home{background:radial-gradient(ellipse at 50% 30%,#0b2038,#05080d 70%)}
#dash{display:none;width:100%;max-width:700px;z-index:2;margin-top:12px}#home.awake #dash{display:block}
.app:focus{outline:none}.app:focus .ic{transform:scale(1.15);filter:drop-shadow(0 0 22px var(--c))}
select{background:#0b0b10;color:var(--tx);border:1px solid var(--g);border-radius:8px;padding:9px;width:100%;margin-top:6px}
#boot{position:fixed;inset:0;z-index:20;background:#05080d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .8s}#boot.off{opacity:0;pointer-events:none}#boot .t{min-height:30px;text-align:center;letter-spacing:.3em;color:var(--c);font-size:clamp(12px,2vw,20px);text-shadow:0 0 10px var(--c);padding:0 16px}
[data-mode=phone] #apps{grid-template-columns:repeat(4,1fr)}
[data-mode=tablet] #apps{grid-template-columns:repeat(5,1fr)}
[data-mode=laptop] #apps{grid-template-columns:repeat(6,1fr);max-width:900px}
[data-mode=tv] #apps{grid-template-columns:repeat(4,1fr);max-width:1500px;gap:4vw}
[data-mode=tv] .app .ic{width:clamp(110px,12vw,220px);font-size:clamp(50px,6vw,100px)}
[data-mode=tv] .app small,[data-mode=tv] .top{font-size:clamp(16px,1.8vw,30px)}
[data-mode=tv] #dash{max-width:1100px}
[data-mode=laptop] #win{inset:auto;left:15vw;top:9vh;width:70vw;height:80vh;min-width:360px;min-height:260px;border:1px solid var(--g);border-radius:12px;background:rgba(5,8,13,.97);resize:both;overflow:hidden;box-shadow:0 20px 80px #000}
[data-mode=laptop] #win header{cursor:move}
</style></head><body>

<div id="boot"><div class="arc" style="width:min(40vw,30vh,240px)"><b></b><b></b><b></b><b></b></div><div class="t" id="bt2"></div><button class="btn" id="skip" style="flex:none;padding:8px 22px">Skip intro</button></div>
<div id="home">
 <div class="top"><span>★ AVENGERS OS · STARK INDUSTRIES</span><span id="hc"></span><span><button id="bell">🔔</button> <button id="relock">Lock</button></span></div>
 <div id="sleep"><div class="mini"><b></b><b></b><i></i></div><h1>Say “Wake up” or “Avengers, assemble”</h1><p id="ls">J.A.R.V.I.S. standing by</p><button class="btn" id="wk">Wake up</button></div>
 <div id="dash"><div class="in2"><input id="gs" placeholder="Search Google…"><button class="btn" id="gb">Go</button></div><div id="rc" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"></div></div><div id="apps"></div>

<div id="lock">
 <canvas id="bg"></canvas>
 <div class="brand">★ AVENGERS INITIATIVE ★</div><div id="clock"><svg viewBox="0 0 200 200" id="sv"></svg><div class="in"><div id="time">00:00</div><div id="date"></div></div></div>
 <div class="bot"><button id="fp" aria-label="Fingerprint unlock"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 20a14 14 0 0 1 28 0"/><path d="M15 38c-2-5-2-9-2-13a11 11 0 0 1 22 0c0 5 1 9 3 12"/><path d="M20 42c-2-4-3-9-3-15a7 7 0 0 1 14 0c0 4 1 8 2 11"/><path d="M25 43c-1-5-2-9-2-16"/><path d="M30 41c-1-3-2-6-2-10"/></svg></button><div class="hint">Touch to unlock</div></div>
 <div id="auth" hidden><div class="card" id="card"><h2 id="at">Unlock</h2><div class="tabs" id="tabs"><button data-t="pin">PIN</button><button data-t="pass">Password</button><button data-t="pattern">Pattern</button></div><input id="inp" type="password" autocomplete="off"><div id="pat" hidden></div><div style="display:flex;gap:8px"><button class="btn" id="ok">Confirm</button><button class="btn" id="cx">Cancel</button></div><div id="msg"></div></div></div>

<script>
const $=s=>document.querySelector(s);
let store=null;try{store=JSON.parse(localStorage.getItem('sos'))}catch(e){}
const save=v=>{store=v;try{localStorage.setItem('sos',JSON.stringify(v))}catch(e){}};
const say=t=>{try{const u=new SpeechSynthesisUtterance(t);u.rate=.95;u.pitch=.8;speechSynthesis.speak(u)}catch(e){}};

/* ---------- clock ---------- */
const sv=$('#sv');let h='<circle cx="100" cy="100" r="97" fill="none" stroke="#ffc247" stroke-width="1"/><circle cx="100" cy="100" r="66" fill="none" stroke="#ffc247" stroke-width=".6" stroke-dasharray="2 4"/>';
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,l=i%5?3:7;h+=`<line x1="${100+Math.sin(a)*90}" y1="${100-Math.cos(a)*90}" x2="${100+Math.sin(a)*(90-l)}" y2="${100-Math.cos(a)*(90-l)}" stroke="#ffc247" stroke-width="${i%5?.6:1.4}"/>`}
h+='<circle id="sa" cx="100" cy="100" r="78" fill="none" stroke="#ff7a1a" stroke-width="3" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90 100 100)"/><g id="ring" style="transform-origin:100px 100px"><circle cx="100" cy="100" r="72" fill="none" stroke="#e5321f" stroke-width="1" stroke-dasharray="14 8 3 8"/></g>';
sv.innerHTML=h;
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
 $('#time').textContent=p(d.getHours())+':'+p(d.getMinutes());
 $('#date').textContent=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
 $('#sa').style.strokeDashoffset=490-490*((d.getSeconds()*1000+d.getMilliseconds())/60000);
 $('#ring').style.transform='rotate('+(performance.now()/60)%360+'deg)';
 $('#hc').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
 requestAnimationFrame(tick)}tick();

/* ---------- magic spell backdrop ---------- */
const cv=$('#bg'),cx=cv.getContext('2d');let W,H;
const runes='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ✦☉☽⚝⌘'.split('');
const sp=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),v:.0006+Math.random()*.0016,s:Math.random()*2+.5}));
function rs(){const r=devicePixelRatio||1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r}rs();addEventListener('resize',rs);
function poly(n,R,rot,sk){cx.beginPath();for(let i=0;i<=n;i++){const a=rot+((i*sk)%n)*2*Math.PI/n;cx[i?'lineTo':'moveTo'](Math.cos(a)*R,Math.sin(a)*R)}cx.stroke()}
function spell(t){cx.fillStyle='rgba(5,6,10,.35)';cx.fillRect(0,0,W,H);
 const m=Math.min(W,H),R=m*.46;cx.save();cx.translate(W/2,H*.4);
 cx.strokeStyle='rgba(255,150,40,.55)';cx.lineWidth=m/500;
 [1,.86,.62].forEach(k=>{cx.beginPath();cx.arc(0,0,R*k,0,7);cx.stroke()});
 poly(6,R*.86,t*.0003,2);poly(6,R*.86,-t*.0003+.5,2);poly(5,R*.62,t*.0005,2);poly(8,R*.62,-t*.0004,3);
 cx.fillStyle='rgba(255,190,80,.9)';cx.font=m/22+'px serif';cx.textAlign='center';cx.textBaseline='middle';
 [[.93,30,1],[.74,22,-1],[.5,14,1.6]].forEach(([k,n,s])=>{for(let i=0;i<n;i++){const a=i*2*Math.PI/n+t*.0002*s;cx.save();cx.rotate(a);cx.translate(0,-R*k);cx.fillText(runes[(i*7+n)%runes.length],0,0);cx.restore()}});
 cx.restore();
 sp.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=1;p.x=Math.random()}cx.fillStyle='rgba(255,'+(140+p.s*30|0)+',40,.8)';cx.fillRect(p.x*W+Math.sin(t*.001+p.x*9)*14,p.y*H,p.s*devicePixelRatio,p.s*devicePixelRatio)});
 requestAnimationFrame(spell)}requestAnimationFrame(spell);

/* ---------- auth ---------- */
let type='pin',pat=[],setup=false;
function view(){document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===type);b.disabled=!setup&&b.dataset.t!==type;b.style.opacity=b.disabled?.35:1});
 $('#inp').hidden=type==='pattern';$('#pat').hidden=type!=='pattern';$('#inp').value='';
 $('#inp').inputMode=type==='pin'?'numeric':'text';$('#inp').placeholder=type==='pin'?'• • • •':'password';pat=[];
 document.querySelectorAll('#pat i').forEach(i=>i.classList.remove('on'));$('#msg').textContent=type==='pattern'?'Draw at least 4 dots':type==='pin'?'Min 4 digits':'Min 4 characters'}
$('#pat').innerHTML='<i data-i="0"></i><i data-i="1"></i><i data-i="2"></i><i data-i="3"></i><i data-i="4"></i><i data-i="5"></i><i data-i="6"></i><i data-i="7"></i><i data-i="8"></i>';
$('#fp').onclick=()=>{setup=!store;type=store?store.type:'pin';$('#at').textContent=setup?'Set up your lock':'Authenticate';$('#auth').hidden=false;view();setTimeout(()=>$('#inp').focus(),50)};
$('#cx').onclick=()=>$('#auth').hidden=true;
$('#tabs').onclick=e=>{if(e.target.dataset.t&&setup){type=e.target.dataset.t;view()}};
function bad(t){$('#msg').textContent=t;const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');pat=[];document.querySelectorAll('#pat i').forEach(i=>i.classList.remove('on'))}
function submit(){const v=type==='pattern'?pat.join(''):$('#inp').value;
 if(type==='pattern'?pat.length<4:v.length<4)return bad('Too short');
 if(type==='pin'&&!/^\d+$/.test(v))return bad('Digits only');
 if(setup){save({type,val:v});unlock()}else if(v===store.val)unlock();else bad('Access denied')}
$('#ok').onclick=submit;$('#inp').onkeydown=e=>{if(e.key==='Enter')submit()};
